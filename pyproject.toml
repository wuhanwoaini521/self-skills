[project]
name = "self-skills"
version = "0.1.0"
description = "Personal Skills Registry — 个人 Skill 的唯一事实源（创建 / 校验 / 测试 / 索引 / 同步）"
requires-python = ">=3.10"
readme = "README.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "beautifulsoup4>=4.12",
    "requests>=2.28",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
